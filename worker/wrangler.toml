name = "connection-stats"
main = "src/index.js"
compatibility_date = "2025-04-01"

# Single user means no write contention, so KV alone is enough — the Durable
# Object this config used to declare only existed to arbitrate between
# different users, and that requirement is gone.
#
# Replace `id` with the value printed by:
#   wrangler kv namespace create CONNECTION_STATS
[[kv_namespaces]]
binding = "CONNECTION_STATS"
id = "PASTE_YOUR_NAMESPACE_ID_HERE"

[observability]
enabled = true

# SYNC_TOKEN is a secret, not a var — never put it in this file, which is
# committed to a public repo. Set it with:
#   wrangler secret put SYNC_TOKEN
